<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stemGrad" x1="32" y1="26" x2="68" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#A855F7" />
      <stop offset="25%" stopColor="#C084FC" />
      <stop offset="55%" stopColor="#E879F9" />
      <stop offset="80%" stopColor="#F472B6" />
      <stop offset="100%" stopColor="#FBBF24" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="50" y1="18" x2="50" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="rgba(233, 213, 255, 0.75)" />
      <stop offset="35%" stopColor="rgba(192, 132, 252, 0.5)" />
      <stop offset="70%" stopColor="rgba(147, 51, 234, 0.35)" />
      <stop offset="100%" stopColor="rgba(88, 28, 135, 0.2)" />
    </linearGradient>
    <linearGradient id="topGlassGrad" x1="30" y1="20" x2="70" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="rgba(245, 235, 255, 0.85)" />
      <stop offset="50%" stopColor="rgba(216, 180, 254, 0.6)" />
      <stop offset="100%" stopColor="rgba(192, 132, 252, 0.4)" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="15" y1="50" x2="85" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#A855F7" />
      <stop offset="50%" stopColor="#C084FC" />
      <stop offset="100%" stopColor="#7E22CE" />
    </linearGradient>
  </defs>

  {/* Outer Acoustic Soundwaves */}
  <ellipse cx="50" cy="62" rx="44" ry="24" stroke="url(#ringGrad)" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.4" />
  <ellipse cx="50" cy="62" rx="38" ry="20" stroke="url(#ringGrad)" stroke-width="1.8" opacity="0.65" />
  <ellipse cx="50" cy="62" rx="32" ry="16" stroke="#D8B4FE" stroke-width="2" opacity="0.9" />

  {/* Underglow & Base */}
  <ellipse cx="50" cy="75" rx="28" ry="10" fill="rgba(168, 85, 247, 0.45)" />
  <path d="M 23 55 L 50 69 L 50 82 L 23 68 Z" fill="#13131A" stroke="rgba(168, 85, 247, 0.5)" stroke-width="1" />
  <path d="M 50 69 L 77 55 L 77 68 L 50 82 Z" fill="#1C1C26" stroke="rgba(168, 85, 247, 0.5)" stroke-width="1" />
  <path d="M 50 46 L 77 55 L 50 69 L 23 55 Z" fill="#262636" stroke="rgba(192, 132, 252, 0.3)" stroke-width="0.8" />

  {/* Translucent Crystal Cap */}
  <path d="M 50 18 L 30 29 L 24 54 L 50 64 Z" fill="url(#glassGrad)" stroke="rgba(255, 255, 255, 0.5)" stroke-width="0.8" />
  <path d="M 50 18 L 70 29 L 76 54 L 50 64 Z" fill="rgba(168, 85, 247, 0.3)" stroke="rgba(255, 255, 255, 0.5)" stroke-width="0.8" />
  <polygon points="50,18 70,29 50,40 30,29" fill="url(#topGlassGrad)" stroke="rgba(255, 255, 255, 0.85)" stroke-width="1" />

  {/* Glowing Switch Stem */}
  <rect x="46.5" y="25" width="7" height="28" rx="3.5" fill="url(#stemGrad)" />
  <rect x="46.5" y="25" width="7" height="28" rx="3.5" transform="rotate(60 50 39)" fill="url(#stemGrad)" />
  <rect x="46.5" y="25" width="7" height="28" rx="3.5" transform="rotate(-60 50 39)" fill="url(#stemGrad)" />

  {/* Specular Highlights */}
  <line x1="50" y1="18" x2="50" y2="64" stroke="rgba(255, 255, 255, 0.85)" stroke-width="1.2" stroke-linecap="round" />
  <circle cx="50" cy="39" r="2" fill="#FFFFFF" />
</svg>
